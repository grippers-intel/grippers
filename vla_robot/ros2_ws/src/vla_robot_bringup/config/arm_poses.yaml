units: "lerobot policy units: servo1-5 degrees, gripper 0-100"

# 순서: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]
#
# measured: false 인 포즈로는 arm_driver 가 움직이지 않는다.
# 실측은 tools/teach_pose.py 로 한다(토크를 끄고 손으로 자세를 잡은 뒤 저장).
poses:
  idle:
    # 정책 학습 시작 자세. gripper_pick_v5_queen 15 에피소드 첫 프레임 중앙값
    # (hardware/grippers/tools/arm/calibration/vla_idle_pose.json, 2026-09-02).
    # shoulder_lift 는 캘리브레이션 하한(822)에 걸려 있다.
    values: [-5.49, -103.3, 95.82, 73.45, -0.18, 6.94]
    measured: true
    note: "VLA 학습 시작 자세 (데이터셋 중앙값)"
  carry:
    # 학습 에피소드는 물체를 문 채 시작 자세로 돌아와 끝난다. 그래서 운반 자세는
    # 시작 자세와 같게 두고, 이동할 때 그리퍼는 유지한다(gripper_mode=1).
    values: [-5.49, -103.3, 95.82, 73.45, -0.18, 6.94]
    measured: true
    note: "idle 과 같음. 그리퍼는 이동 시 유지"
  drop:
    # ⚠️ 미측정. 상자 위로 팔을 뻗은 자세를 teach_pose.py 로 저장할 것.
    values: [0.0, -20.0, 40.0, 60.0, -0.18, 6.94]
    measured: false
    note: "TODO: 상자 위 투하 자세 실측"
