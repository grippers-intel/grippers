# vla_robot — Host(노트북) 설정의 단일 원본.
# 모르는 키가 있으면 run_host.py 가 기동을 거부한다. 기본값·근거는 host_config.py.
# 좌표계(map): 원점 = 가벽 1.8x1.8 m 의 앞쪽 왼쪽 바닥 모서리, +x 오른쪽, +y 뒤쪽,
# yaw = +x 기준 반시계(도), 단위 m.

aruco:
  dictionary: DICT_4X4_50
  robot_marker_id: 0
  robot_marker_size_m: 0.080       # 실측: 검은 사각형 바깥 변
  robot_marker_height_m: 0.270     # 실측: 바닥 -> 마커 중심 (2026-08-27)
  floor_marker_size_m: 0.120
  # 실측: 마커 중심. 인쇄물 윗변이 +y 를 향하게 붙일 것.
  # ⚠️ 2026-09-23 현재 세트장이 없어 마커가 붙어 있지 않다(최종 발표 후 철거).
  #    새로 출력해 두었고, 세트장을 만들면서 아래 좌표에 붙인다 — docs/map_rebuild.md
  floor_markers:
    1: [0.100, 0.400]
    2: [1.700, 0.400]
    3: [0.100, 1.400]
    4: [1.700, 1.400]
  yaw_offset_deg: 85.7             # 2026-09-06 정지 실측. 주행 방식으로 재측정 권장
  pose_hold_s: 1.0
  min_floor_markers: 2
  max_extrinsic_reproj_px: 3.0
  extrinsic_lock_frames: 30
  extrinsic_relock_px: 4.0
  extrinsic_relock_frames: 15

arena:
  # 2026-09-23: 세트장을 다시 만들면서 **가벽은 두지 않는다** — 그래서 한 변이 정확히
  # 1.800 m 다(가벽을 쓰면 1.810 이 된다). 물리 벽이 없어도 이 값은 남는다:
  # 경로계획기가 여기서 로봇 반경을 빼 주행 경계를 만든다. 즉 이제 **가상 경계**다.
  wall_x: [0.0, 1.8]
  wall_y: [0.0, 1.8]
  workspace_x: [0.0, 1.8]
  workspace_y: [0.4, 1.4]          # 앞뒤 400 mm 는 상자 자리
  box_size: [0.210, 0.350, 0.220]
  boxes:
    toy: [0.450, 1.625, 180.0]
    chess: [1.350, 1.625, 180.0]

cameras:
  indices: [0, 1]
  width: 1280
  height: 720
  hfov_deg: 70.4
  calib_dir: calib                 # host/ 기준. cam{index}.npz (K, dist)

detector:
  kind: geti                       # geti | none
  deployment_dir: models/geti_deployment
  device: CPU
  cache_dir: .ov_cache
  min_infer_interval_s: 0.3
  conf_threshold: 0.6
  empty_labels: ["No object", "Empty"]

tracker:
  merge_dist_m: 0.08
  hold_s: 1.5
  confirm_s: 1.2
  label_decay: 0.85
  max_per_label: 2

planner:
  cell_m: 0.025                    # 0.05 는 벽 옆 8 cm 통로가 사라져 "경로 없음"
  robot_radius_wall_m: 0.20
  robot_radius_piece_m: 0.14
  piece_obstacle_radius_m: 0.06
  obstacle_margin_m: 0.05
  drive_area_y: [0.30, 1.30]
  waypoint_step_m: 0.15
  axis_leg_tolerance_m: 0.03
  yaw_tolerance_deg: 5.0
  yaw_enter_deg: 12.0              # 회전 복귀 문턱. 하나로 쓰면 좌우로 떤다
  min_heading_dist_m: 0.05
  obstacle_hold_cycles: 8
  obstacle_match_m: 0.06
  carry_ignore_radius_m: 0.30

drive:
  # ⚠️ 데드밴드가 배터리 전압을 따라 오른다(8.4V: 0.10 겨우, 8.0V: 0.10 안 움직임).
  #    Pi 가 0.15 m/s, 0.5 rad/s 로 자르므로 그보다 크게 줘도 소용없다.
  linear_mps: 0.15
  rotation_rad_s: 0.5
  nudge_mps: 0.15

mission:
  cycle_hz: 10.0
  grasp_trigger_dist_m: 0.35       # 마커 중심 기준 (마커 -0.15- 그리퍼 -0.20- 물체)
  place_trigger_dist_m: 0.35
  box_approach_margin_m: 0.15
  # 바구니 투입 목표 — 도면 docs/layout/workspace_layout.md (2026-09-05).
  # 상자는 yaw180 = 입구가 작업구역 쪽이다. 목표는 상자 중심이 아니라 입구 안쪽의
  # 작은 사각형이다(chess: x[1.320,1.380] y[1.450,1.480], 중심 1.350,1.465).
  insert_half_width_m: 0.03
  insert_inset_depth_m: 0.03
  # 차는 상자 정면(dest_xy)에 서기만 한다. 투입 방향은 **팔의 base 가** 맞춘다 —
  # 남는 좌우 각도를 Host 가 재서 HostCommand.arm_yaw_deg 로 보낸다.
  # 정차점에서 조준점까지 = 팔이 뻗어야 하는 거리. 차는 이보다 더 붙지 않는다(상자에 닿는다).
  # ⚠️ 실측 전 — 값이 기하와 어긋나면 기동 로그에 경고가 뜬다. 팔을 재서 맞출 것.
  arm_reach_m: 0.205
  place_arrive_tol_m: 0.03      # 정차 **거리** 오차 허용치. 좌우는 팔이 메우지만 앞뒤는 못 메운다
  place_aim_margin_m: 0.04      # 판정 목표보다 이만큼 더 안쪽을 겨눈다(허용치보다 커야 한다)
  max_arm_yaw_deg: 15.0         # Pi 의 place.max_base_yaw_deg 와 같은 값. 밖이면 차체를 돌린다
  nudge_max_m: 0.40             # 이만큼 밀고도 정면에 못 서면 재접근
  piece_dest_box:
    queen: chess
    knight: chess
    rook: chess
    star: toy
    soccer: toy
    box: toy
  skip_radius_m: 0.10
  skip_expiry_s: 90.0
  place_retry_max: 2
  grasp_timeout_s: 120.0
  place_timeout_s: 60.0
  blocked_timeout_s: 10.0          # 길이 없어 서 있으면: APPROACH=보류, CARRY=HALTED

link:
  bind_ip: 0.0.0.0
  command_port: 5005
  status_port: 5006
  stop_burst: 8

view:
  px_per_m: 350.0
  panel_width_px: 380
