/* 로봇 시연 UI — "로봇 시연 UI 목업.dc.html"(1a – 1m) 의 값 그대로.
 *
 * 좌표·크기·색은 전부 목업 아트보드에서 실측한 값이다. 목업이 절대 좌표가
 * 아니라 세로 flex 배치라 여기서도 그렇게 짠다 — 화면마다 들어가는 블록이
 * 달라서(대기/접수/실행/완료) 절대 y 로 고정하면 맞출 수가 없다.
 *
 * 스테이지는 432 x 768 논리 픽셀로 만들고 transform 으로 키운다. 1080 x 1920
 * 에서는 정확히 2.5배(432 x 2.5 = 1080)라 목업 숫자를 그대로 쓸 수 있다.
 */

:root {
  --bg: #06090F;
  --frame: #0A0F18;
  --raised: #111A27;          /* 입력 바 · 마이크 */
  --sunken: #0E1622;          /* 접수 화면 에코 바 */
  --sunken-2: #0C131E;        /* 실행 중 "명령 추가…" */
  --card: #121A26;
  --notice: #141B27;
  --tray: #070A11;

  --t1: #E7EDF7;   /* 본문 */
  --t2: #8E9AAB;   /* 보조 */
  --t3: #5C6B80;   /* 흐림 */
  --t4: #4A5768;   /* 더 흐림 — 트레이 버튼·수치 라벨 */
  --t5: #3A4757;   /* 최흐림 — 모노 라벨 */
  --t6: #33404F;   /* READY / COMMAND 라벨 */
  --quiet: #B8C4D6;           /* 실행 중 명령문 */

  --accent: #8B7BFF;
  --accent-2: #B7ACFF;
  --success: #3DE8B0;
  --active: #FF6B4A;
  --active-2: #FF8A6B;
  --caution: #FFA53D;
  --error: #FF4D4D;
  --error-2: #FF6B6B;
  --piece: #9AA7B8;

  --hair: rgba(255, 255, 255, .06);
  --hair-2: rgba(255, 255, 255, .08);
  --hair-3: rgba(255, 255, 255, .16);

  --t-fast: .25s cubic-bezier(.4, 0, .2, 1);
  --t-base: .3s cubic-bezier(.4, 0, .2, 1);

  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: 'Nanum Gothic', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
html, body {
  margin: 0; height: 100%; overflow: hidden; cursor: default;
  background: var(--bg); font-family: var(--sans); -webkit-font-smoothing: antialiased;
}
#viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage {
  position: relative; width: 432px; height: 768px;
  transform: scale(var(--k, 1)); transform-origin: center center;
  background: var(--frame); border-radius: 20px; overflow: hidden;
  color: var(--t1); display: flex; flex-direction: column;
}
.mono { font-family: var(--mono); }
.hide { display: none !important; }

/* 화면 하나가 트레이 위 전체를 차지한다. 동시에 하나만 보인다. */
.screen {
  position: absolute; left: 0; right: 0; top: 0; bottom: 50px;
  display: flex; flex-direction: column;
  animation: rise .3s cubic-bezier(.4, 0, .2, 1);
}
@keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

/* ══ 공통 조각 ══════════════════════════════════════════════ */
.label { font: 700 10px var(--mono); letter-spacing: .2em; color: var(--t6); }
.rule { height: 1px; background: var(--hair-2); }
.mapslot {
  flex: 1; padding: 0 20px; display: flex; align-items: flex-start;
  transition: opacity .35s ease-in-out, transform .35s ease-in-out;
  transform-origin: center top;
}
/* 차단 카드가 뜨면 맵은 55% 로 흐리고 0.87 배로 줄인다 — 명세 §5 */
.mapslot.dim { opacity: .55; transform: scale(.87); }
.mapslot.faint.dim { opacity: .2; }
.mapslot.faint { padding: 4px 20px 0; opacity: .3; }
.mapslot.done { padding: 6px 46px 0; align-items: center; opacity: .42; }
.mapbox { width: 392px; }
.mapslot.done .mapbox { width: 340px; }
.mapbox svg { display: block; width: 100%; height: auto; }

.field {
  /* min-width:0 이 없으면 <input> 의 고유 너비(기본 약 20자)가 flex 를 밀어내
     입력 바가 프레임 밖으로 나가고 마이크 버튼이 잘린다. */
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 2px;
  background: var(--raised); border: 1.5px solid var(--hair-3);
}
.field.big { height: 74px; border-radius: 37px; padding: 0 26px; }
.field.mid { height: 62px; border-radius: 31px; padding: 0 22px; }
.field .ph { font-weight: 700; color: var(--t3); }
.field.big .ph { font-size: 21px; }
.field.mid .ph { font-size: 18px; }

/* 진짜 <input> — 테두리·배경은 감싸는 .field 가 갖고, 글자만 여기서 낸다.
   커서는 브라우저 것을 쓴다(예전엔 깜빡이는 막대를 흉내로 그렸다). */
.inp {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  font-family: var(--sans); font-weight: 700; color: var(--t1);
  caret-color: var(--accent); -webkit-user-select: text; user-select: text;
}
.inp::placeholder { color: var(--t3); opacity: 1; }
.field.big .inp { font-size: 21px; }
.field.mid .inp { font-size: 18px; }
.addfield.inp { font-weight: 400; font-size: 13px; color: #8E9AAB; }
.addfield.inp::placeholder { color: #2E3A49; }
.caret { display: inline-block; width: 2px; background: var(--accent); margin-left: 4px;
         animation: blink 1.1s step-end infinite; }
.field.big .caret { height: 24px; }
.field.mid .caret { height: 20px; }

.mic {
  position: relative; flex: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--raised); cursor: pointer;
}
.mic.big { width: 74px; height: 74px; border: 1.5px solid rgba(139, 123, 255, .5); }
.mic.mid { width: 62px; height: 62px; border: 1.5px solid rgba(139, 123, 255, .45); }
.mic.sm  { width: 46px; height: 46px; background: var(--sunken); border: 1px solid var(--hair-2); }
/* 인식이 확정되면 같은 자리가 전송 버튼이 된다 */
.mic.sm.send { background: var(--accent); border-color: var(--accent); }
.mic .halo {
  position: absolute; inset: 0; border-radius: 50%;
  background: var(--accent); opacity: .5;
  animation: halo 2.4s ease-out infinite;
}
.mic.rec { border-color: rgba(255, 77, 77, .7); }
.mic.rec .halo { background: var(--error); animation-duration: 1.1s; }
.mic.rec svg { stroke: var(--error); }
.inputrow { display: flex; gap: 12px; align-items: center; min-width: 0; }
.inputrow.next { padding: 0 26px 22px; }

.tag {
  height: 24px; padding: 0 9px; border-radius: 5px; cursor: pointer;
  background: rgba(255, 255, 255, .04); color: var(--t4);
  font: 500 10px/24px var(--mono);
}
.tag.on { height: 22px; padding: 0 8px; line-height: 22px;
          background: rgba(255, 255, 255, .06); color: var(--t2); }

/* ══ 1a · 대기 ══════════════════════════════════════════════ */
.idlebody { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 30px; }
.idlebody .label { margin-bottom: 26px; }
.hints { margin-top: 22px; padding-left: 26px; display: flex; flex-direction: column; gap: 7px; }
.hints > div { font: 400 14px/1.4 var(--sans); transition: color .3s, opacity .3s; }
.hints .h1 { color: #66768C; }
.hints .h2 { color: #2E3A49; }
.hints .h3 { color: #222C39; }
.dots { display: flex; gap: 5px; margin-top: 8px; }
.dots i { width: 6px; height: 2px; border-radius: 1px; background: #26313E; transition: width .3s, background .3s; }
.dots i.on { width: 16px; background: var(--accent); }

/* ══ 1i · 음성 입력 중 ══════════════════════════════════════ */
.listenbody {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center; align-items: center; padding: 0 34px;
}
.biggie { position: relative; width: 96px; height: 96px; margin-bottom: 34px; }
.halo.big { position: absolute; inset: 0; border-radius: 50%;
            background: var(--accent); opacity: .45; animation: halo 2s ease-out infinite; }
.orb {
  position: relative; width: 96px; height: 96px; border-radius: 50%;
  background: var(--accent); display: flex; align-items: center; justify-content: center;
}
.wave { display: flex; align-items: flex-end; gap: 4px; height: 40px; margin-bottom: 26px; }
.wave i { width: 4px; border-radius: 2px; background: var(--accent);
          transition: height .09s linear, opacity .09s linear; }
.partial { font-size: 22px; font-weight: 800; line-height: 1.4; text-align: center; text-wrap: pretty; }
.partial u { color: var(--t6); text-decoration: none; }
.listenhint { margin-top: 16px; font: 400 12px var(--sans); color: var(--t4); text-align: center; }

/* ══ 1b · 접수 · 해석 ═══════════════════════════════════════ */
.cmdhead { padding: 30px 26px 16px; }
.cmdhead .label { margin-bottom: 12px; }
.cmdtext { font-size: 25px; font-weight: 800; line-height: 1.36; letter-spacing: -.01em; text-wrap: pretty; }
.cmdhead .rule { margin: 18px 0 14px; }
.interp { display: flex; align-items: center; gap: 9px; }
.idot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
        animation: blink 1s step-end infinite; }
.itext { font: 400 14px var(--sans); color: var(--t2); }
.icode { font: 400 11px var(--mono); color: var(--t5); margin-left: auto; }
.echorow { padding: 0 20px 12px; display: flex; gap: 8px; align-items: center; }
.echo.ready { color: var(--t2); border-color: rgba(139, 123, 255, .35); }
.echo {
  flex: 1; height: 46px; border-radius: 23px; padding: 0 18px;
  display: flex; align-items: center;
  background: var(--sunken); border: 1px solid var(--hair-2);
  color: var(--t6); font-size: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ══ 1c – 1g · 실행 ═════════════════════════════════════════ */
.runhead { padding: 26px 26px 12px; }
.quote { font-size: 21px; font-weight: 800; line-height: 1.35; color: var(--quiet); text-wrap: pretty; }
.runhead .rule { margin: 14px 0 0; }

.targetrow { padding: 8px 26px 14px; display: flex; align-items: center; gap: 12px; }
.tname { font: 800 17px var(--sans); color: var(--success); }
.treason { font: 400 11.5px var(--sans); color: var(--t3); margin-top: 2px; }
.tdist { margin-left: auto; text-align: right; }
.dlabel { font: 500 10px var(--mono); color: var(--t5); letter-spacing: .1em; }
.dval { font: 500 14px var(--mono); color: var(--t2); }

.statusblock { padding: 6px 26px 0; }
.sbrow1 { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--active); transition: background var(--t-base); }
.sko { font: 800 16px var(--sans); }
.sen { font: 500 10.5px var(--mono); color: var(--t4); margin-left: auto; }
.pbar { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.pfill { height: 100%; width: 0; border-radius: 2px; background: var(--active);
         transition: width .2s linear, background var(--t-base); }
.sbrow2 { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; }
.step { font: 400 11px var(--sans); color: var(--t3); }
.metric { display: flex; align-items: center; gap: 6px; font: 500 11px var(--mono); color: var(--t3); }
.gripicon { flex: none; }

.addrow { padding: 0 20px 12px; display: flex; gap: 8px; align-items: center; min-width: 0; }
.addfield {
  flex: 1; height: 42px; border-radius: 21px; padding: 0 18px;
  background: var(--sunken-2); border: 1px solid rgba(255, 255, 255, .07);
  color: #2E3A49; font-size: 13px;
}
.detailrow { padding: 14px 26px 12px; display: flex; align-items: center; gap: 8px; }
.dtitle { font: 500 10px var(--mono); color: var(--t5); letter-spacing: .1em; }
.dline { flex: 1; height: 1px; background: var(--hair); }

/* ══ 1h · 완료 ══════════════════════════════════════════════ */
.donehead { padding: 28px 26px 6px; display: flex; align-items: flex-start; gap: 12px; }
.donehead svg { margin-top: 3px; flex: none; }
.donetitle { font-size: 23px; font-weight: 800; line-height: 1.38; letter-spacing: -.01em; text-wrap: pretty; }
.donesub { padding: 12px 26px 0; font: 400 12px var(--sans); color: var(--t4); }

/* ══ 1k · 1l · 접이식 패널 ══════════════════════════════════ */
.panel {
  position: absolute; left: 0; right: 0; bottom: 50px; z-index: 20;
  padding: 12px 26px 16px;
  background: var(--frame); border-top: 1px solid var(--hair);
  box-shadow: 0 -18px 40px rgba(6, 9, 15, .7);
  animation: rise .25s cubic-bezier(.4, 0, .2, 1);
}
.panelhead { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px 10px; font-family: var(--mono); }
.grid3.legend { gap: 16px 8px; font-family: var(--sans); }
.dk { font-size: 9px; color: var(--t5); letter-spacing: .08em; }
.dv { font-size: 14px; color: #C9D4E4; margin-top: 2px; }
.dv u { font-size: 9px; color: var(--t4); text-decoration: none; }
.dv.accent { color: var(--accent); }
.dv.ok { color: var(--success); }
.gline { height: 1px; background: var(--hair); margin: 14px 0; }
.batts { display: flex; gap: 18px; align-items: center; }
.batt { display: flex; align-items: center; gap: 7px; }
.bk { font-size: 9px; color: var(--t5); letter-spacing: .08em; }
.bbar { width: 38px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.bbar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--success); }
.bv { font-size: 10px; color: var(--t2); }
.lgi { display: flex; align-items: center; gap: 9px; }
.lgn { font: 400 12px var(--sans); color: var(--t2); }
.lgc { font: 400 9.5px var(--mono); color: var(--t5); }

/* ══ 알림 배너 · 차단 카드 ══════════════════════════════════ */
.toast {
  position: absolute; left: 20px; right: 20px; bottom: 60px; z-index: 30;
  display: flex; align-items: center; gap: 9px;
  height: 42px; padding: 0 14px; border-radius: 14px;
  background: var(--notice); border: 1px solid var(--toast-line, rgba(255, 107, 74, .32));
  box-shadow: 0 12px 30px rgba(6, 9, 15, .55);
  animation: rise .25s cubic-bezier(.4, 0, .2, 1);
}
.tdot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--toast-color, var(--active)); }
.ttext { font: 700 12.5px var(--sans); color: #C6D2E2; }
.ttag { margin-left: auto; font: 700 9.5px var(--mono); letter-spacing: .06em;
        padding: 3px 6px; border-radius: 6px;
        background: rgba(255, 255, 255, .05); color: var(--toast-color, var(--active)); }

.cardov {
  position: absolute; left: 18px; right: 18px; bottom: 58px; z-index: 40;
  padding: 18px 18px 15px; border-radius: 18px;
  background: var(--card); border: 1px solid var(--card-line, rgba(255, 77, 77, .34));
  box-shadow: 0 -18px 40px rgba(6, 9, 15, .7);
  animation: rise .3s cubic-bezier(.4, 0, .2, 1);
}
.cardicon {
  width: 34px; height: 34px; border-radius: 50%; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800;
  background: var(--card-soft, rgba(255, 77, 77, .14)); color: var(--card-color, var(--error));
}
.cardtitle { font: 800 19px var(--sans); letter-spacing: -.01em; line-height: 1.35; }
.carddetail { margin-top: 8px; font: 400 13px/1.65 var(--sans); color: var(--t2); }
/* 실제로 들은 문장 (2026-09-08).
   카드 본문과 선택 행 사이에 끼는, 인용문 성격의 블록이다. 카드가 쓰는
   --card-color 를 그대로 받아 예외 색과 한 몸으로 보이게 한다. */
.cardheard { margin-top: 12px; padding: 10px 12px; border-radius: 8px;
             border-left: 2px solid var(--card-color);
             background: var(--card-soft); }
.cardheard.hide { display: none; }
.cardheard .lbl { font: 700 9.5px var(--mono); letter-spacing: .1em;
                  color: var(--card-color); opacity: .85; }
.cardheard .say { margin-top: 5px; font: 500 14px/1.5 var(--sans); color: var(--t1); }
/* 잘못 들은 조각만 표가 나게 — 밑줄 + 색. 나머지 문장은 평범하게 둔다.
   두 곳을 다 강조하면 어디가 문제인지 안 보인다. */
.cardheard .say em { font-style: normal; color: var(--card-color); font-weight: 700;
                     text-decoration: underline; text-decoration-style: wavy;
                     text-underline-offset: 3px; text-decoration-thickness: 1px; }
.cardheard .why { margin-top: 6px; font: 400 11.5px/1.55 var(--sans); color: var(--t2); }

.cardrows { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.cr {
  display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 13px;
  border-radius: 11px; cursor: pointer; color: #D4DEEC;
  background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .09);
}
.cr .l { font: 700 13px/1.45 var(--sans); }
.cr .m { margin-left: auto; font: 400 10px var(--mono); color: var(--t4); white-space: nowrap; }
/* W-401 후보 시트의 신뢰도 바 — 명세 3 x 52 */
.cr .cbar { width: 52px; height: 3px; border-radius: 2px; flex: none;
            background: rgba(255, 255, 255, .08); overflow: hidden; }
.cr .cfill { display: block; height: 100%; border-radius: 2px; background: var(--caution); }
.cardactions { display: flex; gap: 8px; margin-top: 14px; }
.ca {
  height: 44px; padding: 0 18px; border-radius: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1);
  color: #A9B6C8; font: 700 12.5px var(--sans);
}
.ca.primary {
  flex: 1; background: var(--card-color, var(--error)); border-color: var(--card-color, var(--error));
  color: var(--frame); font: 800 14px var(--sans);
}
.cardfoot {
  display: flex; gap: 10px; margin-top: 13px; padding-top: 11px;
  border-top: 1px solid var(--hair);
  font: 500 9.5px var(--mono); letter-spacing: .06em; color: var(--t5);
}
.cardfoot span:last-child { margin-left: auto; }

/* ══ 1m · 하단 운영 트레이 ══════════════════════════════════ */
.tray {
  position: absolute; left: 0; right: 0; bottom: 0; height: 50px; z-index: 50;
  display: flex; align-items: center; gap: 7px; padding: 11px 15px;
  background: var(--tray); border-top: 1px solid var(--hair);
}
.traygrow { flex: 1; }
/* 목업 1m · HALTED — 정지 중에만. 색은 목업의 #FF8A8A 그대로(--error 보다 밝다:
   정지 버튼 자체가 이미 빨간 면이라, 같은 빨강이면 글자가 그 위에서 안 읽힌다). */
.haltnote { flex: 1; font: 700 12px var(--sans); color: #FF8A8A; margin-left: 10px; }
/* 비상 정지는 접거나 숨기지 않고 항상 같은 자리(좌측 첫 칸)에 둔다 — 목업 1m. */
.estop {
  display: flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 11px; border-radius: 6px; cursor: pointer;
  border: 1px solid rgba(255, 77, 77, .4); color: var(--error-2);
  font: 700 10.5px var(--sans); transition: background var(--t-fast), color var(--t-fast);
}
.estop .sq { width: 7px; height: 7px; border-radius: 1px; background: var(--error); }
.estop.armed { background: var(--error); border-color: var(--error); color: #fff; }
.estop.armed .sq { background: #fff; }
.traybtns { display: flex; gap: 5px; }
.tb {
  height: 28px; padding: 0 10px; border-radius: 6px; cursor: pointer;
  background: rgba(255, 255, 255, .03); color: var(--t4);
  font: 500 10.5px/28px var(--mono);
  transition: background var(--t-fast), color var(--t-fast);
}
/* 진행 동작(Next)만 채도를 갖는다 — 목업 1m */
.tb.go { background: rgba(255, 255, 255, .07); color: var(--t2); }
/* 자율 주행 중에는 AUTO 가 주황으로 점등, 사람이 개입하면 소등 — 화면 주석 Stage 3 */
.tb.auto { background: rgba(255, 107, 74, .16); color: var(--active-2); }
/* Reset 은 2단 확인 */
.tb.confirm { background: rgba(255, 77, 77, .16); color: var(--error-2); }
.led { width: 8px; height: 8px; border-radius: 50%; margin-left: 4px; flex: none;
       background: var(--t5); transition: background var(--t-base); }
.led.ready { background: var(--success); }
.led.busy { background: var(--active); }
.led.lost { background: var(--error); }
/* 목업 1m · HALTED 의 LED 는 빨강(#FF4D4D = --error). pose 유실과 색은 같지만
   원인이 달라 클래스를 나눠 둔다 — 로그와 화면을 맞춰 볼 때 구분이 필요하다. */
.led.halt { background: var(--error); }
.trayexp { font: 500 10px var(--mono); color: var(--t5); cursor: pointer; }

/* ══ E_STOP 프레임 · 오류 배너 ══════════════════════════════ */
.estopframe {
  position: absolute; inset: 0; border-radius: 20px; border: 2px solid var(--error);
  pointer-events: none; opacity: 0; z-index: 60;
}
.estopframe.on { animation: estopFrame 1.1s ease-in-out infinite; }
.booterr {
  position: absolute; left: 14px; right: 14px; bottom: 58px; z-index: 70;
  padding: 10px 12px; border-radius: 10px;
  background: rgba(255, 77, 77, .12); border: 1px solid rgba(255, 77, 77, .45);
  color: #FF9B9B; font: 400 10px/1.5 var(--mono); word-break: break-all;
}

@keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
@keyframes halo { 0% { transform: scale(1); opacity: .5 } 100% { transform: scale(1.8); opacity: 0 } }
@keyframes estopFrame { 0%, 100% { opacity: .25 } 50% { opacity: .8 } }
@keyframes ringPulse { 0%, 100% { opacity: .9 } 50% { opacity: .55 } }
@keyframes ringPulse2 { 0%, 100% { opacity: .1 } 50% { opacity: .4 } }

</style>
<script>
// 스크립트 오류를 삼키지 않는다 — 화면이 검게만 뜨면 원인을 알 수가 없어서,
// 여기에 모아두고 화면 아래에도 한 줄로 띄운다(ui/app.js 의 showBootError).
window.__errs = [];
window.addEventListener("error", function (e) {
  window.__errs.push((e.filename || "").split("/").pop() + ":" + e.lineno + " " + e.message);

/* ─── arena.js ─── */
/* ArenaMap — 작업 영역(1.8 x 1.8 m) 탑뷰 렌더러.
 *
 * 핸드오프의 ArenaMap.dc.html 을 그대로 옮긴 것이다. 좌표계·축척·아이콘
 * path·색은 전부 명세 §8 값 그대로:
 *
 *   1 m = 200 단위, 뷰박스 400 x 400, 원점 오프셋 x 36 / y 366
 *   X(m) = 36 + m * 200      Y(m) = 366 - m * 200      (y축 위쪽이 +)
 *
 * dc 파일 원본과 다른 점은 딱 하나 — 매 프레임 전체를 다시 만들지 않고
 * DOM 노드를 유지한 채 속성만 바꾼다. 그래야 CSS transition 이 걸려서
 * 로봇/기물이 순간이동하지 않고 부드럽게 따라간다(실제 검출은 10Hz 정도로
 * 띄엄띄엄 들어온다).
 */

(function () {
"use strict";


// vla_robot: 장판 크기는 Host 가 window.ARENA_MAT = [가로, 세로](m) 로 준다(1.98 x 1.83).
// 원본은 1.8 x 1.8 고정(1 m = 200)이었다 — 긴 변이 360 단위에 맞게 축척을 정한다.
const MAT = (window.ARENA_MAT && window.ARENA_MAT.length === 2) ? window.ARENA_MAT : [1.8, 1.8];
const S = 360 / Math.max(MAT[0], MAT[1]), OX = 36, OY = 366;
const FW = MAT[0] * S, FH = MAT[1] * S, FY = OY - FH;
const X = m => +(OX + m * S).toFixed(2);
const Y = m => +(OY - m * S).toFixed(2);

// 기물 아이콘 — 24 x 24 박스 기준 path. ArenaMap.dc.html 의 SHAPES 상수 그대로.
const SHAPES = {
  box: "M4.4 5.4h15.2a1.4 1.4 0 0 1 1.4 1.4v10.4a1.4 1.4 0 0 1-1.4 1.4H4.4A1.4 1.4 0 0 1 3 17.2V6.8a1.4 1.4 0 0 1 1.4-1.4Zm-1.4 4.1h18v1.7H3Zm8.2 1.7h1.6v7.4h-1.6Z",
  soccer: "M2.5 12a9.5 9.5 0 1 0 19 0 9.5 9.5 0 1 0-19 0ZM12 8l3.8 2.76-1.45 4.48h-4.7L8.2 10.76Zm-.45-.2-.05-5.39h.95l.05 5.39ZM15.85 10.27l5.11-1.71.31.95-5.14 1.62ZM14.11 15.66l3.12 4.39.81-.59-3.21-4.32ZM9.17 15.14l-3.21 4.32.81.59 3.12-4.39ZM8.15 10.27l-5.42-.76.3-.95 5.14 1.62Z",
  star: "M12 2.5 14.47 8.6 21.03 9.06 15.99 13.3 17.59 19.69 12 16.2 6.41 19.69 8.01 13.3 2.97 9.06 9.53 8.6Z",
  queen: "M3.4 19.6h17.2l1.3-11.7-5.4 4.1L12 4.8 7.5 12 2.1 7.9ZM12 1a1.9 1.9 0 1 1 0 3.8A1.9 1.9 0 0 1 12 1Z",
  knight: "M4.6 21H19.4C19.4 14.4 18.6 10 16.4 7.4L17.6 2.8 13.6 5.6 11.4 6.4 5.4 8.6 2.6 10.2 2.6 12.4 6.2 12 5.2 14.2 9.4 13.6C8 16.2 6.2 18.6 4.6 21ZM12.4 7.7a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1Z",
  rook: "M4 4 7.2 4 7.2 6.6 10.4 6.6 10.4 4 13.6 4 13.6 6.6 16.8 6.6 16.8 4 20 4 20 9.4 18 9.4 18 16 20.4 21 3.6 21 6 16 6 9.4 4 9.4Z",
};
const FALLBACK_SHAPE = "M12 3.5a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17Z";

const COLOR = { piece: "#9AA7B8", success: "#3DE8B0", accent: "#8B7BFF", active: "#FF6B4A", error: "#FF4D4D" };

const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};

// 경로 점들(m 단위)을 SVG path d 문자열로.
const dstr = pts => pts.map((p, i) => (i ? "L" : "M") + X(p[0]) + " " + Y(p[1])).join(" ");
const plen = pts => {
  let L = 0;
  for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  return L;
};

class ArenaMap {
  constructor(svg, opts = {}) {
    this.svg = svg;
    this.onPick = opts.onPick || null;
    this._pieceNodes = new Map();   // id -> {path, hit}
    this._built = false;
    this._build();
  }

  _build() {
    const svg = this.svg;
    svg.innerHTML = "";

    const style = el("style");
    style.textContent = `
      .pc { transition: transform .35s cubic-bezier(.4,0,.2,1), fill .3s, opacity .3s; }
      /* 위치와 방향은 **같은 곡선·같은 길이**여야 한다.
         예전에는 위치 .13s linear / 방향 .25s ease-out 이었다. 두 가지가
         동시에 어긋났다:
           1) 길이가 달라서 회전 중에 삼각형이 가는 방향과 가리키는 방향이
              따로 놀았다(방향이 위치보다 120ms 늦게 도착).
           2) ease-out 은 "한 번 움직이고 멈추는" 값을 위한 곡선인데, 제자리
              회전 중 yaw 는 매 사이클(50–140ms) 새 값이 온다. 250ms 짜리
              감속 곡선이 끝나기 전에 계속 새로 시작되니 빨라졌다 느려졌다를
              반복했다 — 실제 회전은 등속인데 화면만 울컥거린 것이다.
         갱신 주기와 비슷한 길이의 linear 로 맞춘다. */
      .rb { transition: transform .13s linear; }
      .rr { transition: transform .13s linear; }
      .ring1 { animation: ringPulse .6s ease-in-out infinite; }
      .ring2 { animation: ringPulse2 .6s ease-in-out infinite; }
      .fade { transition: opacity .4s ease-in-out; }
      .held { transition: transform .13s linear, opacity .25s; }
      .grip { transition: opacity .2s; }
      .gs { transition: d .1s linear; }
    `;
    svg.appendChild(style);

    // ── 프레임 + 격자 + 눈금 (정적) ─────────────────────────
    svg.appendChild(el("rect", {
      x: OX, y: FY, width: FW, height: FH, rx: 3,
      fill: "#0D1420", stroke: "rgba(255,255,255,0.14)", "stroke-width": 1.5,
    }));

    const gridG = el("g", { stroke: "rgba(255,255,255,0.045)", "stroke-width": 1 });
    for (let v = 0.2; v < MAT[0] - 1e-6; v += 0.2)
      gridG.appendChild(el("line", { x1: X(v), y1: FY, x2: X(v), y2: OY }));
    for (let v = 0.2; v < MAT[1] - 1e-6; v += 0.2)
      gridG.appendChild(el("line", { x1: OX, y1: Y(v), x2: OX + FW, y2: Y(v) }));
    svg.appendChild(gridG);

    const tickG = el("g", { fill: "#3B4859", "font-family": "'JetBrains Mono',monospace", "font-size": 9 });
    [0, 0.5, 1.0, 1.5, 2.0].forEach(v => {
      if (v <= MAT[0] + 1e-6) {
        const a = el("text", { x: X(v), y: 380, "text-anchor": "middle" }); a.textContent = v.toFixed(1);
        tickG.appendChild(a);
      }
      if (v <= MAT[1] + 1e-6) {
        const b = el("text", { x: 30, y: Y(v) + 3, "text-anchor": "end" }); b.textContent = v.toFixed(1);
        tickG.appendChild(b);
      }
    });
    const xl = el("text", { x: 216, y: 394, "text-anchor": "middle", fill: "#2F3B4A" }); xl.textContent = "x (m)";
    // vla_robot: 눈금이 0.5 간격이 되면서 1.0 눈금과 겹치지 않게 0.75 m 높이(눈금 사이)에 둔다.
    const YL = Y(Math.min(0.75, MAT[1] / 2)).toFixed(1);
    const yl = el("text", { x: 12, y: YL, "text-anchor": "middle", fill: "#2F3B4A", transform: `rotate(-90 12 ${YL})` });
    yl.textContent = "y (m)";
    tickG.appendChild(xl); tickG.appendChild(yl);
    svg.appendChild(tickG);

    // ── 박스 구역 (state.map.boxes 로 갱신) ─────────────────
    this._zoneG = el("g", { class: "fade" });
    svg.appendChild(this._zoneG);

    // ── 기준 마커 (state.map.markers 로 갱신) ───────────────
    this._markerG = el("g", { class: "fade", opacity: 1 });
    svg.appendChild(this._markerG);

    // ── 탐색 링 (SCANNING) ──────────────────────────────────
    this._scanG = el("g", { fill: "none", stroke: COLOR.accent, opacity: 0, class: "fade" });
    this._scan1 = el("circle", { r: 22, "stroke-width": 1.5 });
    this._scan2 = el("circle", { r: 80, "stroke-width": 1.5 });
    this._scanG.appendChild(this._scan1); this._scanG.appendChild(this._scan2);
    svg.appendChild(this._scanG);

    // ── 경로: 남은 구간(점선) → 지나온 구간(실선) ───────────
    this._rem = el("path", {
      fill: "none", stroke: COLOR.accent, "stroke-width": 2,
      "stroke-dasharray": "5 6", "stroke-linecap": "round", opacity: 0,
    });
    this._trav = el("path", {
      fill: "none", stroke: COLOR.accent, "stroke-width": 3,
      "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0,
    });
    svg.appendChild(this._rem);
    svg.appendChild(this._trav);

    // ── 기물 ────────────────────────────────────────────────
    this._pieceG = el("g", {});
    svg.appendChild(this._pieceG);
    this._hitG = el("g", {});
    svg.appendChild(this._hitG);

    // ── 대상 링 2겹 (r 19 / 26, 0.6초 주기 맥동) ────────────
    this._ring1 = el("circle", { r: 19, fill: "none", stroke: COLOR.success, "stroke-width": 1.5, opacity: 0 });
    this._ring2 = el("circle", { r: 26, fill: "none", stroke: COLOR.success, "stroke-width": 1, opacity: 0 });
    svg.appendChild(this._ring1); svg.appendChild(this._ring2);

    // ── 집게 두 획 ──────────────────────────────────────────
    this._gripG = el("g", {
      class: "grip", opacity: 0, stroke: COLOR.active,
      "stroke-width": 2.5, "stroke-linecap": "round", fill: "none",
    });
    this._gripL = el("path", { class: "gs" });
    this._gripR = el("path", { class: "gs" });
    this._gripG.appendChild(this._gripL); this._gripG.appendChild(this._gripR);
    svg.appendChild(this._gripG);

    // ── 로봇: 감지 반경 2겹 + 진행 방향 삼각형 ──────────────
    this._robotG = el("g", { class: "rb", opacity: 0 });
    // 두 링의 반경은 **실기 상수에서 온다**(map.robot_r_m / map.safe_r_m).
    // 여기 숫자를 박아 두면 팀원이 ROBOT_RADIUS_PIECE_M 을 고쳤을 때 화면만
    // 옛 값을 그리게 되고, 그 순간 이 지도는 "안전해 보이는데 실제로는
    // 스치는"(또는 그 반대) 그림이 된다. 아래 기본값은 상태가 오기 전
    // 첫 프레임용이고, _syncStatic() 이 매번 실제 값으로 덮어쓴다.
    this._ringSafe = el("circle", {
      cx: 0, cy: 0, r: 28, fill: "none",
      stroke: "rgba(255,107,74,0.16)", "stroke-width": 1, "stroke-dasharray": "3 5",
    });
    this._ringBody = el("circle", {
      cx: 0, cy: 0, r: 16, fill: "none",
      stroke: "rgba(255,107,74,0.3)", "stroke-width": 1, "stroke-dasharray": "3 4",
    });
    this._robotG.appendChild(this._ringSafe);
    this._robotG.appendChild(this._ringBody);
    this._robotRot = el("g", { class: "rr" });
    this._robotTri = el("path", { d: "M13 0 -8 -9.5 -4 0 -8 9.5Z", fill: COLOR.active });
    this._robotRot.appendChild(this._robotTri);
    this._robotG.appendChild(this._robotRot);
    svg.appendChild(this._robotG);

    // ── 운반 중인 기물(로봇 위, 중심에서 y −40) ─────────────
    this._held = el("path", { class: "held", fill: COLOR.success, "fill-rule": "evenodd", opacity: 0 });
    svg.appendChild(this._held);

    // vla_robot: 사람 손(가져다줄 곳) — state.hands = [{x, y, spot}]. 주황(caution) 링 + 위치 이름.
    this._handG = el("g", {});
    svg.appendChild(this._handG);

    // ── 장애물(W-108) ───────────────────────────────────────
    this._obsG = el("g", { class: "fade", opacity: 0 });
    this._obsC = el("circle", {
      r: 17, fill: "rgba(255,77,77,0.1)", stroke: COLOR.error,
      "stroke-width": 1.5, "stroke-dasharray": "4 3",
    });
    this._obsX = el("path", { fill: "none", stroke: COLOR.error, "stroke-width": 2.2, "stroke-linecap": "round" });
    this._obsG.appendChild(this._obsC); this._obsG.appendChild(this._obsX);
    svg.appendChild(this._obsG);

    // ── E_STOP 적색 테두리 ──────────────────────────────────
    this._estop = el("rect", {
      x: OX, y: FY, width: FW, height: FH, rx: 3,
      fill: "rgba(255,77,77,0.06)", stroke: COLOR.error, "stroke-width": 2, opacity: 0,
    });
    svg.appendChild(this._estop);

    this._built = true;
  }

  /* 박스 구역/기준 마커는 config 에서 오므로 값이 바뀔 때만 다시 그린다. */
  _syncStatic(map) {
    // 로봇 링 — 미터를 그대로 화면 단위로(1 m = 200). 값이 없으면(옛 상태)
    // 만들 때의 기본값을 그대로 둔다.
    if (map.safe_r_m != null) this._ringSafe.setAttribute("r", map.safe_r_m * S);
    if (map.robot_r_m != null) this._ringBody.setAttribute("r", map.robot_r_m * S);

    const key = JSON.stringify([map.boxes, map.markers]);
    if (key === this._staticKey) {
      // 목적지로 지정된 박스만 라벨을 민트로 — 이건 매번 갱신.
      (map.boxes || []).forEach((b, i) => {
        const t = this._zoneLabels && this._zoneLabels[i];
        if (t) t.setAttribute("fill", b.active ? COLOR.success : "#8391A6");
      });
      return;
    }
    this._staticKey = key;

    this._zoneG.innerHTML = "";
    this._zoneLabels = [];
    (map.boxes || []).forEach(b => {
      this._zoneG.appendChild(el("rect", {
        x: X(b.x0), y: Y(b.y1), width: (b.x1 - b.x0) * S, height: (b.y1 - b.y0) * S, rx: 3,
        fill: "rgba(255,255,255,0.035)", stroke: "rgba(255,255,255,0.16)",
        "stroke-width": 1, "stroke-dasharray": "3 4",
      }));
      const t = el("text", {
        x: X(b.x0) + 10, y: Y(b.y1) + 18,
        "font-family": "'JetBrains Mono',monospace", "font-size": 11,
        fill: b.active ? COLOR.success : "#8391A6", "letter-spacing": 1.5,
      });
      t.textContent = (b.name || "").toUpperCase();
      this._zoneG.appendChild(t);
      this._zoneLabels.push(t);
    });

    this._markerG.innerHTML = "";
    (map.markers || []).forEach(m => {
      this._markerG.appendChild(el("rect", {
        x: X(m[0]) - 6.5, y: Y(m[1]) - 6.5, width: 13, height: 13, rx: 1.5,
        fill: "none", stroke: "rgba(61,232,176,0.55)", "stroke-width": 1.5,
      }));
      const t = el("text", {
        x: X(m[0]), y: Y(m[1]) + 3, "font-family": "'JetBrains Mono',monospace",
        "font-size": 8, fill: "rgba(61,232,176,0.75)", "text-anchor": "middle",
      });
      t.textContent = m[2] != null ? String(m[2]) : "";
      this._markerG.appendChild(t);
    });
  }

  /* 매 상태 갱신마다 호출. s 는 ui_state.py 가 만든 state 그대로. */
  render(s) {
    const map = s.map || {};
    this._syncStatic(map);

    const hasTarget = !!s.target_id;
    const pieces = s.pieces || [];
    const held = s.held || null;

    // 기준 마커는 대상이 확정되면 옅게 (명세: markerFade)
    this._markerG.setAttribute("opacity", hasTarget ? 0.45 : 1);

    // ── 기물 ────────────────────────────────────────────────
    const seen = new Set();
    for (const p of pieces) {
      seen.add(p.id);
      let node = this._pieceNodes.get(p.id);
      if (!node) {
        const path = el("path", { class: "pc", "fill-rule": "evenodd" });
        const hit = el("circle", { r: 24, fill: "transparent", style: "cursor:pointer" });
        hit.addEventListener("click", () => this.onPick && this.onPick(p.id));
        this._pieceG.appendChild(path);
        this._hitG.appendChild(hit);
        node = { path, hit };
        this._pieceNodes.set(p.id, node);
        // 새로 감지된 기물은 페이드 인 (명세: 기물 순차 등장).
        // rAF 로 다음 프레임을 기다리면 창이 가려졌을 때 콜백이 안 돌아
        // 투명도 0 인 채로 남는다 — setTimeout 은 느려질지언정 반드시 돈다.
        path.setAttribute("opacity", 0);
        setTimeout(() => path.setAttribute("opacity", node.op == null ? 0.9 : node.op), 20);
      }
      const isTarget = p.id === s.target_id;
      const isHeld = held && held.id === p.id;
      const w = isTarget ? 34 : 28;                        // 명세: 대상만 28 → 34
      const k = (w / 24).toFixed(3);
      node.path.setAttribute("d", SHAPES[p.label] || FALLBACK_SHAPE);
      node.path.setAttribute("transform",
        `translate(${(X(p.x) - w / 2).toFixed(2)} ${(Y(p.y) - w / 2).toFixed(2)}) scale(${k})`);
      node.path.setAttribute("fill",
        (p.state === "done" || isTarget) ? COLOR.success : COLOR.piece);
      // 대상 외 기물은 투명도 45% (명세 §8)
      let op = isHeld ? 0 : (hasTarget ? (isTarget ? 1 : 0.45) : 0.9);
      node.op = op;
      node.path.setAttribute("opacity", op);
      node.hit.setAttribute("cx", X(p.x));
      node.hit.setAttribute("cy", Y(p.y));
      // 로봇이 움직이는 중에는 탭을 받지 않는다 (명세 §8)
      node.hit.style.pointerEvents = s.pickable ? "auto" : "none";
    }
    for (const [id, node] of this._pieceNodes) {
      if (seen.has(id)) continue;
      node.path.remove(); node.hit.remove();
      this._pieceNodes.delete(id);
    }

    // ── 대상 링 ─────────────────────────────────────────────
    const tgt = pieces.find(p => p.id === s.target_id);
    const ringOn = tgt && !held;
    [this._ring1, this._ring2].forEach((r, i) => {
      if (ringOn) {
        r.setAttribute("cx", X(tgt.x)); r.setAttribute("cy", Y(tgt.y));
        r.setAttribute("opacity", i ? 0.35 : 0.9);
        r.setAttribute("class", i ? "ring2" : "ring1");
      } else {
        r.setAttribute("opacity", 0);
        r.setAttribute("class", "");
      }
    });

    // ── 경로 ────────────────────────────────────────────────
    const path = s.path || {};
    const pts = path.pts || [];
    const blocked = !!path.blocked;
    if (pts.length >= 2) {
      // 지나온 구간은 로봇이 지나온 만큼 — 파이썬이 t 를 안 주면 전부 남은 구간.
      const t = path.t == null ? 0 : Math.max(0, Math.min(1, path.t));
      const w = this._walk(pts, t);
      this._trav.setAttribute("d", t > 0 ? dstr(w.trav) : "");
      this._trav.setAttribute("opacity", t > 0 ? 1 : 0);
      this._trav.setAttribute("stroke", blocked ? COLOR.active : COLOR.accent);
      this._rem.setAttribute("d", dstr(w.rem));
      this._rem.setAttribute("stroke", blocked ? COLOR.error : COLOR.accent);
      // 계획 경로 그려지는 연출: 길이만큼 dashoffset 을 0 으로 (0.65초)
      if (this._remKey !== dstr(w.rem)) {
        this._remKey = dstr(w.rem);
        const L = plen(w.rem) * S;
        this._rem.style.transition = "none";
        this._rem.style.strokeDashoffset = L;
        this._rem.setAttribute("opacity", 0.75);
        // 같은 이유로 rAF 대신 setTimeout — 창이 가려진 동안 rAF 가 멈추면
        // dashoffset 이 L 인 채로 굳어서 남은 경로가 통째로 안 보인다.
        setTimeout(() => {
          this._rem.style.transition = "stroke-dashoffset .65s ease-out";
          this._rem.style.strokeDashoffset = 0;
        }, 20);
      }
    } else {
      this._trav.setAttribute("opacity", 0);
      this._rem.setAttribute("opacity", 0);
      this._remKey = null;
    }

    // ── 로봇 ────────────────────────────────────────────────
    const r = s.robot || {};
    if (r.ok) {
      this._robotG.setAttribute("opacity", 1);
      this._robotG.setAttribute("transform", `translate(${X(r.x)} ${Y(r.y)})`);
      // yaw 는 +x축 기준 반시계(도). SVG 는 y가 아래로 자라므로 부호를 뒤집는다.
      this._robotRot.setAttribute("transform", `rotate(${(-(r.yaw || 0)).toFixed(1)})`);
      this._robotTri.setAttribute("fill", r.fresh === false ? "#C97B4A" : COLOR.active);
    } else {
      this._robotG.setAttribute("opacity", 0);
    }

    // ── vla_robot: 손 ───────────────────────────────────────
    this._handG.innerHTML = "";
    (s.hands || []).forEach(h => {
      this._handG.appendChild(el("circle", {
        cx: X(h.x), cy: Y(h.y), r: 13, fill: "rgba(255,165,61,0.10)",
        stroke: "#FFA53D", "stroke-width": 1.5, "stroke-dasharray": "4 3",
      }));
      const t = el("text", {
        x: X(h.x), y: Y(h.y) + 3, "text-anchor": "middle", fill: "#FFA53D",
        "font-family": "'JetBrains Mono',monospace", "font-size": 8,
      });
      t.textContent = h.spot && h.spot !== "?" ? h.spot : "HAND";
      this._handG.appendChild(t);
    });

    // ── 운반 중인 기물 ──────────────────────────────────────
    if (held && r.ok) {
      this._held.setAttribute("d", SHAPES[held.label] || FALLBACK_SHAPE);
      this._held.setAttribute("transform",
        `translate(${(X(r.x) - 13).toFixed(2)} ${(Y(r.y) - 40).toFixed(2)}) scale(1.083)`);
      this._held.setAttribute("opacity", 1);
    } else {
      this._held.setAttribute("opacity", 0);
    }

    // ── 집게 (집기/놓기 순간에만) ───────────────────────────
    const grip = s.grip == null ? 0 : s.grip;
    if (s.show_grip && tgt) {
      const cx = X(tgt.x), cy = Y(tgt.y);
      // 좌우에서 6px 안쪽으로 닫힘 (명세 §3)
      this._gripL.setAttribute("d", `M${(cx - 17 + 6 * grip).toFixed(1)} ${(cy - 11).toFixed(1)}q-5 11 0 22`);
      this._gripR.setAttribute("d", `M${(cx + 17 - 6 * grip).toFixed(1)} ${(cy - 11).toFixed(1)}q5 11 0 22`);
      this._gripG.setAttribute("opacity", 1);
    } else {
      this._gripG.setAttribute("opacity", 0);
    }

    // ── 탐색 링 (SCANNING) ──────────────────────────────────
    if (s.scanning && r.ok) {
      const ph = (performance.now() / 1400) % 1;
      this._scanG.setAttribute("opacity", 1);
      [[this._scan1, ph], [this._scan2, (ph + 0.5) % 1]].forEach(([c, f]) => {
        c.setAttribute("cx", X(r.x)); c.setAttribute("cy", Y(r.y));
        c.setAttribute("r", (22 + 130 * f).toFixed(1));
        c.setAttribute("opacity", (0.5 * (1 - f)).toFixed(3));
      });
    } else {
      this._scanG.setAttribute("opacity", 0);
    }

    // ── 장애물 ──────────────────────────────────────────────
    if (s.obstacle) {
      const [ox, oy] = s.obstacle;
      this._obsC.setAttribute("cx", X(ox)); this._obsC.setAttribute("cy", Y(oy));
      this._obsX.setAttribute("d",
        `M${X(ox) - 6} ${Y(oy) - 6}L${X(ox) + 6} ${Y(oy) + 6}M${X(ox) + 6} ${Y(oy) - 6}L${X(ox) - 6} ${Y(oy) + 6}`);
      this._obsG.setAttribute("opacity", 1);
    } else {
      this._obsG.setAttribute("opacity", 0);
    }

    this._estop.setAttribute("opacity", s.estop ? 1 : 0);
  }

  /* 경로를 진행률 t(0~1) 로 잘라 지나온/남은 구간으로 나눈다. */
  _walk(pts, t) {
    const segs = [];
    let total = 0;
    for (let i = 1; i < pts.length; i++) {
      const L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      segs.push(L); total += L;
    }
    if (total < 1e-9) return { trav: [pts[0]], rem: pts.slice() };
    const want = total * t;
    let acc = 0;
    const trav = [pts[0]];
    for (let i = 0; i < segs.length; i++) {
      if (acc + segs[i] <= want + 1e-9) {
        acc += segs[i]; trav.push(pts[i + 1]);
        if (i === segs.length - 1) return { trav, rem: [pts[i + 1]] };
      } else {
        const f = (want - acc) / segs[i];
        const p = [
          pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f,
          pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f,
        ];
        trav.push(p);
        return { trav, rem: [p].concat(pts.slice(i + 1)) };
      }
    }
    return { trav: [pts[0]], rem: pts.slice() };
  }
}

window.ArenaMap = ArenaMap;
window.ARENA_SHAPES = SHAPES;
})();

</script>

<script>
/* ─── app.js ─── */
/* 화면 갱신 · 입력 처리.
 *
 * 파이썬(ui_state.py)이 만든 state 를 받아 DOM 에 반영만 한다 — 한국어 문구 ·
 * 상태 판정 · 예외 코드는 전부 파이썬에 있다. 그래야 로그에 남는 상태와 사람이
 * 보는 화면이 갈라지지 않는다.
 *
 * 화면 구성은 "로봇 시연 UI 목업.dc.html" 의 1a – 1m 을 따른다. 목업은 단계마다
 * 들어가는 블록 자체가 달라서(대기 / 접수·해석 / 실행 / 완료), 한 화면을 부분만
 * 바꾸는 게 아니라 네 화면을 갈아 끼운다.
 */

(function () {
"use strict";

const $ = id => document.getElementById(id);

const TONE = {
  accent:  { c: "#8B7BFF", soft: "rgba(139,123,255,.14)", line: "rgba(139,123,255,.32)" },
  success: { c: "#3DE8B0", soft: "rgba(61,232,176,.14)",  line: "rgba(61,232,176,.34)" },
  active:  { c: "#FF6B4A", soft: "rgba(255,107,74,.14)",  line: "rgba(255,107,74,.32)" },
  caution: { c: "#FFA53D", soft: "rgba(255,165,61,.14)",  line: "rgba(255,165,61,.32)" },
  error:   { c: "#FF4D4D", soft: "rgba(255,77,77,.14)",   line: "rgba(255,77,77,.34)" },
};
const tone = t => TONE[t] || TONE.accent;

const SCREENS = { idle: "scIdle", listen: "scListen", command: "scCommand",
                  run: "scRun", done: "scDone" };

let maps = {};          // 화면마다 ArenaMap 인스턴스가 하나씩
let state = null;
let hostSeen = false;
let lastCardKey = null;
let panel = null;       // "detail" | "legend" | null
let prevScreen = null;

/* ── 배율: 창 크기에 맞춰 432 x 768 스테이지를 키운다 ───────── */
function fitStage() {
  document.documentElement.style.setProperty(
    "--k", Math.min(window.innerWidth / 432, window.innerHeight / 768));
}

/* ── 파이썬으로 이벤트 보내기 ───────────────────────────────── */
function send(action, payload) {
  // 지금 화면을 "누가 굴리고 있는지" 를 보고 보낸다.
  //
  // pywebview.api 가 있는지로 판단하면 안 된다 — ui_bridge.py 미리보기도 창을
  // 띄우는 이상 api 는 항상 존재한다. 그러면 버튼을 눌러도 목업이 아니라
  // 파이썬으로 가버려서, 미리보기에서 마이크를 눌러도 아무 일이 안 일어난다.
  if (window.MOCK && window.MOCK.on) { window.MOCK.event(action, payload); return; }
  const api = window.pywebview && window.pywebview.api;
  if (api && api.ui_event) api.ui_event(action, payload == null ? null : payload);
  else console.log("[ui] event(연결 안 됨):", action, payload);
}

function showBootError(msg) {
  const n = $("booterr");
  if (!n) return;
  n.textContent = "화면 스크립트 오류 — " + msg;
  n.classList.remove("hide");
}

/* ── 파이썬이 부르는 입구 ───────────────────────────────────
 * 진짜 상태가 한 번이라도 오면 목업을 영구히 끈다. pywebview 가 언제
 * window.pywebview 를 주입하는지에 기대지 않기 위한 것(주입 시점이 상황마다
 * 달라서, 그걸 보고 판단하면 목업이 실물을 덮어쓰거나 아무 것도 안 돈다). */
function applyHostState(s) {
  if (!hostSeen) {
    hostSeen = true;
    if (window.MOCK && window.MOCK.stop) window.MOCK.stop();
  }
  applyState(s);
}

/* ── 상태 반영 ──────────────────────────────────────────────── */
function applyState(s) {
  if (hostSeen && s && s.__mock) return;     // 늦게 도착한 목업 프레임은 버린다
  state = s;
  const tn = tone(s.tone);

  // 화면 갈아 끼우기.
  //
  // CSS 애니메이션은 요소에 붙은 순간 한 번만 돈다 — hide 만 벗겨서는 두 번째
  // 전환부터 등장 효과가 안 난다(명세 §3: 등장은 아래에서 위로 + 페이드).
  // 화면이 바뀔 때 애니메이션을 명시적으로 다시 튼다.
  const switched = !prevScreen || prevScreen !== s.screen;
  for (const k in SCREENS) $(SCREENS[k]).classList.toggle("hide", k !== s.screen);
  if (switched) {
    const el = $(SCREENS[s.screen]);
    if (el) { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; }
    prevScreen = s.screen;
  }

  if (s.screen === "idle") renderIdle(s);
  else if (s.screen === "listen") renderListen(s);
  else if (s.screen === "command") renderCommand(s);
  else if (s.screen === "run") renderRun(s, tn);
  else if (s.screen === "done") renderDone(s);

  // 맵 — 지금 보이는 화면의 것만 그린다
  const mapId = { command: "mapCommand", run: "mapRun", done: "mapDone" }[s.screen];
  if (mapId && maps[mapId]) maps[mapId].render(s);
  // 차단 카드가 뜬 동안에는 맵을 뒤로 물린다(명세 §5).
  document.querySelectorAll(".mapslot").forEach(n => n.classList.toggle("dim", !!s.card));

  renderPanels(s);
  renderToast(s);
  renderCard(s);
  renderTray(s);
  $("estopframe").classList.toggle("on", !!s.estop);
}

function renderIdle(s) {
  const d = s.idle || {};
  $("idleLabel").textContent = d.label || "READY";
  const inp = $("idleInput");
  inp.placeholder = d.placeholder || "무엇을 시킬까요?";
  const hints = d.hints || [];
  ["hint1", "hint2", "hint3"].forEach((id, i) => { $(id).textContent = hints[i] || ""; });
  const dots = $("hintDots");
  if (dots.children.length !== (d.dots || 4)) {
    dots.innerHTML = "";
    for (let i = 0; i < (d.dots || 4); i++) dots.appendChild(document.createElement("i"));
  }
  [...dots.children].forEach((n, i) => n.classList.toggle("on", i === (d.dot || 0)));
  $("micIdle").classList.toggle("rec", !!s.recording);
}

const WAVE_BARS = 8;
function renderListen(s) {
  const w = $("wave");
  if (w.children.length !== WAVE_BARS) {
    w.innerHTML = "";
    for (let i = 0; i < WAVE_BARS; i++) w.appendChild(document.createElement("i"));
  }
  // 막대는 목업 1i 의 높이 범위(10 – 38px)를 그대로 쓴다. 실제 입력 레벨이
  // 오면 그 값으로, 없으면 잔잔하게 흔든다.
  const lv = s.level == null ? 0.5 : s.level;
  const t = performance.now() / 130;
  [...w.children].forEach((n, i) => {
    const a = 0.5 + 0.5 * Math.sin(t + i * 0.9);
    const h = 10 + 28 * Math.min(1, lv * (0.45 + 0.75 * a));
    n.style.height = h.toFixed(1) + "px";
    n.style.opacity = (0.35 + 0.65 * a).toFixed(2);
  });
  const c = s.command || {};
  $("partialText").innerHTML = (c.partial || "") + '<u>…</u>';
  $("listenHint").textContent = c.hint || "듣고 있습니다 · 말이 끝나면 자동으로 전송돼요";
}

function renderCommand(s) {
  const c = s.command || {};
  $("cmdText").textContent = c.text || "";
  $("interpText").textContent = c.interp_text || "";
  $("interpCode").textContent = c.interp_code || "";
  $("interpDot").style.background = tone(s.tone).c;
  $("echoText").textContent = c.echo || "";

  // 인식이 확정된 동안에는 같은 버튼이 "전송" 이 된다.
  const sendable = c.action === "send";
  const btn = $("micCommand");
  btn.classList.toggle("rec", !!s.recording);
  btn.classList.toggle("send", sendable);
  btn.querySelector(".ic-mic").classList.toggle("hide", sendable);
  btn.querySelector(".ic-send").classList.toggle("hide", !sendable);
  $("echoText").classList.toggle("ready", sendable);
}

function renderRun(s, tn) {
  $("runQuote").textContent = (s.run && s.run.quote) || "";

  // Stage 2(대상 요약 줄) 와 Stage 3(상태·진행률) 은 배타적으로 뜬다.
  const showTarget = !!(s.run && s.run.mode === "target");
  $("targetRow").classList.toggle("hide", !showTarget);
  $("addRow").classList.toggle("hide", !showTarget);
  $("statusBlock").classList.toggle("hide", showTarget);
  $("detailRow").classList.toggle("hide", showTarget);

  if (showTarget) {
    const t = s.target || {};
    const path = (window.ARENA_SHAPES || {})[t.label];
    $("targetIcon").innerHTML = path
      ? `<path fill-rule="evenodd" d="${path}" fill="#3DE8B0"></path>` : "";
    $("targetName").textContent = t.title || "";
    $("targetReason").textContent = t.reason || "";
    $("targetDist").textContent = t.distance || "—";
  } else {
    const st = s.status || {};
    $("sdot").style.background = tn.c;
    $("statusKo").textContent = st.ko || "";
    $("statusEn").textContent = st.en || "";
    $("stepKo").textContent = st.step || "";
    $("metric").textContent = st.metric || "";
    $("gripIcon").classList.toggle("hide", !st.grip);
    const pf = $("pfill");
    pf.style.width = ((st.progress || 0) * 100).toFixed(1) + "%";
    pf.style.background = tn.c;
  }
}

function renderDone(s) {
  const d = s.done || {};
  $("doneTitle").textContent = d.title || "";
  $("doneSub").textContent = d.sub || "";
}

/* ── 1k · 1l 접이식 패널 ────────────────────────────────────── */
function renderPanels(s) {
  const onDetail = panel === "detail";
  const onLegend = panel === "legend";
  $("detailPanel").classList.toggle("hide", !onDetail);
  $("legendPanel").classList.toggle("hide", !onLegend);
  $("detailToggle").textContent = onDetail ? "⌃ 접기" : "⌄ 펼치기";
  $("legendToggle").textContent = onLegend ? "범례 ⌃" : "범례 ⌄";

  if (onDetail) {
    const d = s.detail || {};
    const cells = [
      ["X", d.x, "m", ""], ["Y", d.y, "m", ""], ["YAW", d.yaw, "°", ""],
      ["CMD", d.cmd, "", "accent"], ["TARGET", d.target, "", "ok"], ["GRIP", d.grip, "", ""],
    ];
    $("detailGrid").innerHTML = cells.map(([k, v, u, cls]) =>
      `<div><div class="dk">${k}</div><div class="dv ${cls}">${v == null ? "—" : v}` +
      (u ? `<u>${u}</u>` : "") + `</div></div>`).join("");
    setBatt("battVeh", "battVehTxt", d.veh, d.veh_txt);   // vla_robot: 글자는 전압(V)
    setBatt("battArm", "battArmTxt", d.arm, d.arm_txt);
  }
  if (onLegend) {
    const items = s.legend || [];
    $("legendTitle").textContent = `LEGEND · 기물 ${items.length}종`;
    $("legendGrid").innerHTML = items.map(it => {
      const p = (window.ARENA_SHAPES || {})[it.label] || "";
      return `<div class="lgi"><svg width="24" height="24" viewBox="0 0 24 24">` +
        `<path fill-rule="evenodd" d="${p}" fill="${it.n ? "#8E9AAB" : "#3A4757"}"></path></svg>` +
        `<div><div class="lgn">${it.ko}</div>` +
        `<div class="lgc">${it.label} · ${it.n}</div></div></div>`;
    }).join("");
  }
}

function setBatt(barId, txtId, v, label) {
  const bar = $(barId), txt = $(txtId);
  if (v == null) { bar.style.width = "0%"; bar.style.background = "#3A4757"; txt.textContent = "—"; return; }
  bar.style.width = Math.max(0, Math.min(100, v)) + "%";
  bar.style.background = v < 20 ? "#FF4D4D" : v < 40 ? "#FFA53D" : "#3DE8B0";
  txt.textContent = label || (Math.round(v) + "%");
}

/* ── 알림 배너 · 차단 카드 ──────────────────────────────────── */
function renderToast(s) {
  const n = s.notice, box = $("toast");
  if (!n) { box.classList.add("hide"); return; }
  const tn = tone(n.tone);
  box.style.setProperty("--toast-color", tn.c);
  box.style.setProperty("--toast-line", tn.line);
  $("toastText").textContent = n.text;
  $("toastCode").textContent = n.code;
  box.classList.remove("hide");
}

/* "이렇게 들었습니다" 블록.
 *
 * heard.hit 이 있으면 그 조각만 <em> 으로 감싸 밑줄을 긋는다. 문자열을
 * innerHTML 로 넣지 않는다 — 인식 결과는 사람이 말한 것이고 목업에선
 * 고정 문장이지만, 실기에서는 whisper 가 뱉은 임의의 문자열이 그대로
 * 여기로 온다. 그때 태그가 섞여 들어오면 화면이 깨진다. 조각을 기준으로
 * 잘라 textContent 로 세 번 붙이는 편이 안전하고, 코드도 짧다. */
function renderHeard(h) {
  const box = $("cardHeard");
  if (!h || !h.text) { box.classList.add("hide"); return; }
  box.classList.remove("hide");
  const say = $("cardHeardText");
  say.innerHTML = "";
  const i = h.hit ? h.text.indexOf(h.hit) : -1;
  if (i < 0) {
    say.appendChild(document.createTextNode("\u201C" + h.text + "\u201D"));
  } else {
    const em = document.createElement("em");
    em.textContent = h.hit;
    say.appendChild(document.createTextNode("\u201C" + h.text.slice(0, i)));
    say.appendChild(em);
    say.appendChild(document.createTextNode(h.text.slice(i + h.hit.length) + "\u201D"));
  }
  $("cardHeardWhy").textContent = h.why || "";
}

function renderCard(s) {
  const card = s.card, box = $("cardov");
  if (!card) { box.classList.add("hide"); lastCardKey = null; return; }
  const key = JSON.stringify(card);
  if (key !== lastCardKey) {
    lastCardKey = key;
    const tn = tone(card.tone);
    box.style.setProperty("--card-color", tn.c);
    box.style.setProperty("--card-soft", tn.soft);
    box.style.setProperty("--card-line", tn.line);
    $("cardIcon").textContent = card.icon || "!";
    $("cardTitle").textContent = card.title || "";
    $("cardDetail").textContent = card.detail || "";
    $("cardCode").textContent = card.code || "";
    $("cardNext").textContent = card.next || "";
    renderHeard(card.heard);
    const rows = $("cardRows");
    rows.innerHTML = "";
    (card.rows || []).forEach(r => {
      const n = document.createElement("div");
      n.className = "cr";
      // bar 가 있으면 신뢰도 막대를 함께 그린다(W-401 후보 시트).
      n.innerHTML = '<span class="l"></span>'
                  + (r.bar == null ? "" : '<span class="cbar"><i class="cfill"></i></span>')
                  + '<span class="m"></span>';
      n.children[0].textContent = r.label;
      if (r.bar != null) {
        n.querySelector(".cfill").style.width = Math.max(0, Math.min(1, r.bar)) * 100 + "%";
      }
      n.children[n.children.length - 1].textContent = r.meta || "";
      n.addEventListener("click", () => send(r.act || "card_row", r.id));
      rows.appendChild(n);
    });
    const acts = $("cardActions");
    acts.innerHTML = "";
    (card.actions || []).forEach(a => {
      const n = document.createElement("div");
      n.className = "ca" + (a.primary ? " primary" : "");
      n.textContent = a.label;
      n.addEventListener("click", () => send("card_action", a.id));
      acts.appendChild(n);
    });
  }
  box.classList.remove("hide");
}

/* ── 1m · 하단 운영 트레이 ──────────────────────────────────── */
let resetArmed = null;
function renderTray(s) {
  const t = s.tray || {};
  const mode = $("modeBtn");
  mode.textContent = t.manual ? "MANUAL" : "AUTO";
  // 자율 주행 중에만 주황 점등. 사람이 개입한 동안은 소등 — 화면 주석 Stage 3.
  mode.classList.toggle("auto", !!t.auto);
  // 수동 모드에서 "지금 넘길 수 있다"일 때만 밝힌다 — 예전엔 manual 이기만
  // 하면 항상 켜져 있어서, 아직 진행 중인데도 누르면 되는 것처럼 보였다.
  $("nextBtn").classList.toggle("go", !!t.ready);

  // 목업 1m · 정지 중에는 트레이 구성 자체가 바뀐다.
  const halted = !!t.estop_armed;
  $("estop").classList.toggle("armed", halted);
  $("estopLabel").textContent = halted ? "정지됨 · 해제" : "비상 정지";
  $("haltNote").classList.toggle("hide", !halted);
  $("trayGrow").classList.toggle("hide", halted);   // 빨간 한 줄이 그 자리를 대신 민다
  // Prev/Next 는 정지 중에 숨긴다 — 구동이 멎은 상태에서 단계를 넘기는 버튼이
  // 눌리는 자리에 남아 있으면, 눌러도 아무 일이 안 일어나는 것이 고장으로 읽힌다.
  $("prevBtn").classList.toggle("hide", halted);
  $("nextBtn").classList.toggle("hide", halted);
  $("led").className = "led " + (t.led || "");
}

/* ── 입력 배선 ──────────────────────────────────────────────── */
function wire() {
  ["micIdle", "micDone"].forEach(id =>
    $(id).addEventListener("click", () => send("mic")));
  // 1b 의 버튼은 상태에 따라 전송이거나 다시 말하기다.
  $("micCommand").addEventListener("click", () =>
    send(state && state.command && state.command.action === "send" ? "run" : "mic"));
  $("echoText").addEventListener("click", () => {
    if (state && state.command && state.command.action === "send") send("run");
  });
  // 타이핑으로도 명령할 수 있어야 한다(마이크가 없거나 시끄러운 자리).
  // Enter 로 전송 — 예전 live_map.py 의 "지시" 패널과 같은 역할이다.
  ["idleInput", "doneInput", "addField"].forEach(id => {
    const el = $(id);
    el.addEventListener("keydown", e => {
      e.stopPropagation();                    // 아래 전역 단축키와 안 부딪히게
      if (e.key !== "Enter") return;
      const text = el.value.trim();
      if (!text) return;
      el.value = "";
      send("submit", text);
    });
  });
  $("estop").addEventListener("click", () => send("estop"));
  $("modeBtn").addEventListener("click", () => send("toggle_mode"));
  $("prevBtn").addEventListener("click", () => send("prev"));
  $("nextBtn").addEventListener("click", () => send("next"));

  const togglePanel = name => { panel = panel === name ? null : name; if (state) applyState(state); };
  $("detailToggle").addEventListener("click", () => togglePanel("detail"));
  $("detailCollapse").addEventListener("click", () => togglePanel("detail"));
  $("legendToggle").addEventListener("click", () => togglePanel("legend"));
  $("legendCollapse").addEventListener("click", () => togglePanel("legend"));
  // 트레이 우측 "v ⌃" — 디버그와 범례를 번갈아 연다.
  $("trayExpand").addEventListener("click", () =>
    togglePanel(panel === "detail" ? "legend" : "detail"));

  // Reset 은 2단 확인 — 목업 1m 의 "한 번 더 누르면 초기화".
  $("resetBtn").addEventListener("click", () => {
    const b = $("resetBtn");
    if (resetArmed) {
      clearTimeout(resetArmed); resetArmed = null;
      b.classList.remove("confirm"); b.textContent = "Reset";
      send("reset");
      return;
    }
    b.classList.add("confirm"); b.textContent = "확인?";
    resetArmed = setTimeout(() => {
      resetArmed = null;
      b.classList.remove("confirm"); b.textContent = "Reset";
    }, 2500);
  });

  // 시연 중 마우스 없이 조작할 수 있게.
  window.addEventListener("keydown", e => {
    // 입력창에 타이핑하는 중이면 단축키로 가로채지 않는다.
    if (e.target && e.target.classList && e.target.classList.contains("inp")) return;
    if (e.key === " ") { e.preventDefault(); send("mic"); }
    else if (e.key === "Escape") send("estop");
    else if (e.key === "ArrowRight") send("next");
    else if (e.key === "ArrowLeft") send("prev");
    else if (e.key === "d") togglePanel("detail");
    else if (e.key === "l") togglePanel("legend");
  });
}

/* ── 시작 ───────────────────────────────────────────────────── */
function boot() {
  window.showBootError = showBootError;
  (window.__errs || []).forEach(showBootError);
  fitStage();
  window.addEventListener("resize", fitStage);

  ["mapCommand", "mapRun", "mapDone"].forEach(id => {
    const host = $(id);
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 400 400");
    host.appendChild(svg);
    maps[id] = new window.ArenaMap(svg, { onPick: pid => send("pick", pid) });
  });

  wire();

  // 파형은 파이썬 상태(10Hz)에 맞춰 그리면 뚝뚝 끊긴다. 녹음 중에만 매 프레임
  // 다시 그린다 — 나머지 화면은 상태가 올 때만 갱신한다. 여기만 rAF 를 쓰는 건
  // 순수한 장식이라서다(창이 가려지면 멈춰도 상관없다).
  (function spin() {
    if (state && state.screen === "listen") renderListen(state);
    requestAnimationFrame(spin);
  })();

  window.applyState = applyState;
  window.applyHostState = applyHostState;

  // 목업을 켤지 말지 — ui_bridge.DemoUI 가 실물을 물고 창을 열면
  // window.__hostAttached 를 켜준다(그러면 목업은 아예 안 돈다).
  setTimeout(() => {
    if (hostSeen || window.__hostAttached) return;
    if (window.MOCK) window.MOCK.start();
  }, 600);
}

document.addEventListener("DOMContentLoaded", boot);
})();

</script>

<script>
/* ─── mock.js ─── */
/* 목업 구동기 — 로봇 없이 UI 만 확인할 때 쓴다.
 *
 * 실물 미션이 붙지 않은 창/브라우저에서만 돈다 — 시작 여부는 app.js 가 정한다
 * (ui_bridge.DemoUI 가 창을 열 때 window.__hostAttached 로 알려준다).
 * 켜지면 전체 흐름(대기 → 음성 → 인식 → 실행 7단계 → 완료)을 재생한다.
 *
 * 여기 문구는 ui_state.py 와 같은 값을 쓴다 — 한쪽만 고치면 목업과 실물이
 * 갈라지므로, 문구를 바꿀 때는 두 파일을 같이 고칠 것.
 *
 * 키: Space 마이크 · Enter 실행 · Esc 비상정지 · 1 W-108 · 2 E-210 · 3 E-201
 */

(function () {
"use strict";

/* 기물을 매번 다르게 흩뿌린다 — 같은 배치만 보면 경로 문제를 못 잡는다.
 * 상자 구역(y 1.45 이상)과 서로에게서 충분히 떨어뜨린다. */
function scatter() {
  const pos = {};
  const placed = [];
  M_PIECES.forEach(p => {
    for (let tries = 0; tries < 200; tries++) {
      const x = 0.20 + Math.random() * 1.40;
      const y = 0.15 + Math.random() * 1.15;        // 상자 구역은 피한다
      if (placed.every(q => Math.hypot(q[0] - x, q[1] - y) > 0.28)) {
        pos[p.id] = [+x.toFixed(3), +y.toFixed(3)];
        placed.push(pos[p.id]);
        return;
      }
    }
    pos[p.id] = [p.x, p.y];                          // 자리를 못 찾으면 기본값
  });
  return pos;
}

// 받침에 맞는 조사 — ui_state.py 의 josa() 와 같은 규칙.
function josa(w, kind) {
  if (!w) return w;
  const c = w.charCodeAt(w.length - 1);
  const jong = (c >= 0xAC00 && c <= 0xD7A3) ? (c - 0xAC00) % 28 : 0;
  if (kind === "euro") return w + ((jong === 0 || jong === 8) ? "로" : "으로");
  if (kind === "eun") return w + (jong === 0 ? "는" : "은");
  if (kind === "i") return w + (jong === 0 ? "가" : "이");
  return w + (jong === 0 ? "를" : "을");
}

const d2 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

/* 경로 선택 — "로봇 시연 프로토타입.dc.html" 의 route()/clearance() 그대로.
 *
 * 후보 네 개(ㄱ자 두 방향 · 완만한 곡선 · 직선 대각)를 만들어 놓고, 다른
 * 기물에서 가장 멀리 떨어지는 것을 고른다. 그래서 트인 곳에서는 대각선으로
 * 곧장 가고, 앞이 막히면 알아서 돌아간다.
 *
 * ※ 이건 시연 UI 모션 기준이다. 실제 차량은 축정렬(ㄱ자)로만 달린다 —
 *   navigator.py 머리말 참고("사선으로 못 움직이고 … 일부러 직진 전용").
 */
function segFoot(p, a, b) {
  const vx = b[0] - a[0], vy = b[1] - a[1];
  const L = vx * vx + vy * vy;
  if (L < 1e-9) return { d: d2(p, a), t: 0 };
  let u = ((p[0] - a[0]) * vx + (p[1] - a[1]) * vy) / L;
  u = Math.max(0, Math.min(1, u));
  return { d: d2(p, [a[0] + u * vx, a[1] + u * vy]), t: u };
}
const distSeg = (p, a, b) => segFoot(p, a, b).d;

/* 경로가 장애물에서 얼마나 떨어져 있는지.
 *
 * 첫 구간의 최근접점이 출발점 그 자리면 세지 않는다 — 장애물이 로봇 옆이나
 * 뒤에 있다는 뜻이라 앞으로 가면 오히려 멀어진다. 이걸 "막혔다" 로 치면
 * 출발하자마자 쓸데없이 돌아가고, 접선 근처에서 제자리를 맴돈다.
 * navigator.next_waypoint() 가 쓰는 규칙과 같다(거기 주석 참고). */
function clearance(pts, avoid) {
  let m = 9;
  for (let i = 1; i < pts.length; i++) {
    avoid.forEach(a => {
      const f = segFoot(a, pts[i - 1], pts[i]);
      if (i === 1 && f.t <= 1e-3) return;
      m = Math.min(m, f.d);
    });
  }
  return m;
}
/* 경로 하나를 고른다.
 *
 * 실제 차량과 같은 규칙이다(navigator.next_waypoint):
 *   ① 로봇 → 목표 직선이 안전거리 안에서 트여 있으면 **그냥 곧장 간다**.
 *   ② 막혔으면 그 장애물을 경로에 수직으로 비켜간 점 하나를 끼워 넣는다.
 *      비켜간 경로가 이번엔 다른 기물에 붙으면 한 번 더 끼워 넣는다.
 *      (실제 차량은 매 사이클 다시 계산해서 같은 결과로 수렴한다.)
 *   ③ 그래도 안 되면 ㄱ자/ㄴ자 후보 중 가장 여유 있는 것.
 *
 * 예전에는 "후보 중 여유가 가장 큰 것"만 골라서, 트인 곳에서도 ㄱ자가 대각선보다
 * 여유가 크면 ㄱ자로 갔다 — 실제 차량은 그럴 때 곧장 간다.
 */
function worstOn(pts, avoid) {
  let worst = null, wd = 9, seg = 0;
  for (let i = 1; i < pts.length; i++) {
    avoid.forEach(a => {
      const f = segFoot(a, pts[i - 1], pts[i]);
      if (i === 1 && f.t <= 1e-3) return;      // 옆/뒤에 있는 것은 장애물이 아니다
      if (f.d < wd) { wd = f.d; worst = a; seg = i; }
    });
  }
  return { obs: worst, dist: wd, seg };
}

/* seg 번째 구간에서 장애물 obs 를 수직으로 비켜간 점을 끼운 후보들. */
function bypassCandidates(pts, seg, obs) {
  const a = pts[seg - 1], b = pts[seg];
  const vx = b[0] - a[0], vy = b[1] - a[1];
  const L = Math.hypot(vx, vy) || 1;
  const nx = -vy / L, ny = vx / L;
  const out = [];
  [1, -1].forEach(sgn => {
    [1.0, 1.5].forEach(k => {
      const p = [obs[0] + nx * SAFE_M * k * sgn, obs[1] + ny * SAFE_M * k * sgn];
      out.push(pts.slice(0, seg).concat([p], pts.slice(seg)));
    });
  });
  return out;
}

function route(from, to, avoid) {
  from = clampDrive(from); to = clampDrive(to);
  let pts = [from, to];
  let cl = clearance(pts, avoid);
  // 우회 후보가 상자 쪽으로 밀어낼 수 있어 매 통과마다 다시 자른다.
  for (let pass = 0; pass < 2 && cl < SAFE_M; pass++) {
    const w = worstOn(pts, avoid);
    if (!w.obs) break;
    let best = pts, bc = cl;
    bypassCandidates(pts, w.seg, w.obs).forEach(c => {
      const v = clearance(c, avoid);
      if (v > bc) { bc = v; best = c; }
    });
    if (best === pts) break;          // 더 나아지지 않으면 멈춘다
    pts = best.map(clampDrive); cl = bc;
  }
  if (cl >= SAFE_M) return { pts: pts.map(clampDrive), clear: cl };

  // ③ 마지막으로 ㄱ자/ㄴ자와도 비교한다.
  [[from, [to[0], from[1]], to], [from, [from[0], to[1]], to]].forEach(c => {
    const v = clearance(c, avoid);
    if (v > cl) { cl = v; pts = c; }
  });
  return { pts: pts.map(clampDrive), clear: cl };
}

// 안전거리 — 기물 회피반경 + 차량 반경 + 여유.
// mission_config.py 의 PIECE_OBSTACLE_RADIUS_M + ROBOT_RADIUS_PIECE_M
// + OBSTACLE_MARGIN_M (2026-09-07 실기 값으로 맞춤 — 예전 값 0.32 는 옛
// 스냅샷의 로봇 반경 0.16 을 쓰고 있었다). 실기는 차체 반경을 벽용 0.20 과
// 기물용 0.08 로 나눠 갖고 있고, 여기 쓰는 것은 기물용이다.
const SAFE_M = 0.06 + 0.08 + 0.05;

/* 상자를 밟지 않게 하는 선 (2026-09-08, 사용자 지시).
 *
 * 상자는 y 1.45 부터다(M_BOXES). 로봇 반경이 0.08 이므로 **중심**이
 * 1.37 을 넘는 순간 차체가 상자 위로 올라선다. 그 전까지 이 목업의
 * route() 는 기물만 피하고 상자는 아예 안 봤다 — 그래서 아레나를 가로지를
 * 때 상자를 통과하고, 투하 직전 접근점(beginNudge)도 상자 안이었다.
 *
 * 실기에도 같은 문제가 있어 별도로 고쳤다(host/box_guard.py) — 거기서는
 * 팀원이 이미 "절대 안전 반경"으로 선언해 둔 hard_stop 선(1.40)을 썼다.
 * 여기서는 그릴 로봇이 실제로 보이므로 차체 가장자리가 상자 앞면에 딱
 * 닿는 1.37 로 잡는다.
 *
 * 선분은 두 끝점을 잇는 직선이라, **끝점만 잘라도 중간이 튀어나올 수 없다.**
 * 그래서 route() 가 내는 점들과 직접 만드는 구간의 끝점만 자르면 된다. */
const DRIVE_MAX_Y = 1.45 - 0.08;
const clampDrive = p => [p[0], Math.min(p[1], DRIVE_MAX_Y)];
const toward = (t, f, gap) => {
  const L = Math.max(1e-6, d2(t, f));
  return [t[0] + (f[0] - t[0]) / L * gap, t[1] + (f[1] - t[1]) / L * gap];
};
const plen = pts => {
  let L = 0;
  for (let i = 1; i < pts.length; i++) L += d2(pts[i - 1], pts[i]);
  return L;
};

/* 어느 단계에서 어떤 예외가 날 수 있는가 (2026-09-08).

    // 안 도는 일이 생긴다. 시작/정지는 app.js 가 시킨다.
    if (this.on) return;
