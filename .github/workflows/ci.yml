name: CI

# README "Testing": 매 push마다 lint + unittest + Fake 어댑터 기반 전체 미션 파이프라인 실행
# README "Contributing > 품질": PR마다 lint + unittest 자동 실행
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 정적분석 (ruff) + 포맷 검사 (black) ───────────────────────────────
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install ruff black

      - name: ruff check
        run: ruff check .

      - name: black --check
        run: black --check .

  # ── 하드웨어 불필요 unittest: domain/ + Fake 어댑터 기반 전체 미션 파이프라인 ──
  test:
    name: Unit tests (Fake adapters)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov

      # domain/, ports/, adapters/fake는 ROS2·하드웨어 의존성이 없는 순수 Python이라
      # 패키징(pyproject) 없이도 PYTHONPATH만 잡아주면 바로 import 가능합니다.
      - name: Run domain / Fake-adapter test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --cov=domain --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14